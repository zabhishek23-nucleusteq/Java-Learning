spring.application.name=notification-service

server.port=8082

#spring.kafka.bootstrap-servers=localhost:9092
#spring.kafka.consumer.group-id=notification-group
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
#spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka broker address
spring.kafka.bootstrap-servers=localhost:9092

# Consumer group
spring.kafka.consumer.group-id=notification-group

# Use ErrorHandlingDeserializer to prevent crashes
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegate deserializer to JsonDeserializer for actual value deserialization
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Trust the package where OrderEvent is located
#spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.notification_service.dto

# (Optional but recommended) If you use type headers, trust class names from these packages
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.notification_service.dto.OrderEvent

spring.kafka.consumer.properties.spring.json.trusted.packages=*

