plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
//	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	// Spring Boot Web - for creating REST APIs
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// Spring Data JPA - ORM and database interactions
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// JDBC Support - for low-level JDBC if needed
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	// H2 in-memory database - useful for development and testing
	runtimeOnly 'com.h2database:h2'

	// Apache POI - for reading/writing Excel files (.xls/.xlsx)
	implementation 'org.apache.poi:poi-ooxml:5.4.0'

	// Lombok - to reduce boilerplate code (getters, setters, etc.)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	implementation 'org.modelmapper:modelmapper:3.2.0'

	// Spring Boot Testing Starter - includes JUnit, AssertJ, etc.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// Mockito Core - for unit testing with mocks
	testImplementation 'org.mockito:mockito-core:5.11.0'

	// Optional: Needed if you want to explicitly run tests with custom launcher
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.kafka:spring-kafka'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
