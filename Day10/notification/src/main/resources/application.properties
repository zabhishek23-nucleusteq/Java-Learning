# ===============================
# Application Settings
# ===============================
spring.application.name=notification
server.port=8085

# ===============================
# Kafka Configuration
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Consumer-specific settings
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.notification.DTO
spring.kafka.consumer.properties.spring.json.remove.type.headers=false

# (Optional) Declare topic name as a reusable property
employee.kafka.topic=employee-topic

# ===============================
# H2 In-Memory Database Configuration
# ===============================
spring.datasource.url=jdbc:h2:mem:feignlearnemp
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Console (Optional)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
